services:
  swd-mysql:
    image: mysql:8.0
    container_name: nagriksetu-swd-mysql8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nagriksetu_swd
      MYSQL_USER: swd_app
      MYSQL_PASSWORD: swd-secure-pass-2026
    ports:
      - "3307:3306"
    volumes:
      - nagriksetu_swd_mysql8_data:/var/lib/mysql
    restart: unless-stopped

  swd-backend:
    build: ./backend
    container_name: nagriksetu-swd-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVICE_NAME: swd-service
      ENVIRONMENT: production
      PORT: 8004
      DB_HOST: swd-mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-nagriksetu_swd}
      DB_USER: ${DB_USER:-swd_app}
      DB_PASSWORD: ${DB_PASSWORD:-swd-secure-pass-2026}
      JWT_SECRET: ${JWT_SECRET:-nagriksetu-swd-super-secret-key-2026-xyz-min32chars}
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: 5672
      RABBITMQ_ENABLED: "false"
      CORS_ORIGINS: "http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8005:8004"
    volumes:
      - nagriksetu_swd_uploads_data:/app/uploads
    depends_on:
      - swd-mysql
    restart: unless-stopped

  swd-frontend:
    build: ./frontend
    container_name: nagriksetu-swd-frontend
    ports:
      - "5175:80"
      - "5174:80"
    depends_on:
      - swd-backend
    restart: unless-stopped

volumes:
  nagriksetu_swd_mysql8_data:
    external: true
  nagriksetu_swd_uploads_data:

