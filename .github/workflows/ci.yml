name: NagrikSetu SWD CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript & Build Check
        working-directory: frontend
        run: npm run build

  backend-checks:
    name: Backend Syntax, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx flake8

      - name: Python Syntax & Lint Check
        working-directory: backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Unit Tests (SQLite Fixtures & Mock RBAC)
        working-directory: backend
        env:
          ENV: testing
          DATABASE_URL: sqlite:///./test_ci.db
          PYTHONPATH: .
        run: |
          python -m pytest -v tests/test_citizen_auth.py tests/test_profile_management.py tests/test_rbac_security.py

  mysql-schema-validation:
    name: Isolated MySQL 8.0 DDL & Integration Validation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: nagriksetu_swd
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python for Schema Execution & Integration Check
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pymysql cryptography

      - name: Validate and Apply Clean DDL Schema File via Python
        run: |
          python -c "
          import os, pymysql

          conn = pymysql.connect(
              host='127.0.0.1',
              port=3306,
              user='root',
              password='root_ci_password',
              autocommit=True
          )
          cursor = conn.cursor()

          # Apply clean schema fixture containing all 19 tables with zero personal records
          with open('database/swd_clean_schema.sql', 'r', encoding='utf-8') as f:
              sql = f.read()

          for stmt in sql.split(';'):
              s = stmt.strip()
              if s:
                  cursor.execute(s)

          print('Successfully initialized all 19 clean schema tables.')
          cursor.close()
          conn.close()
          "

      - name: Verify SQLAlchemy Dialect & Table Reflection against Isolated MySQL
        env:
          DATABASE_URL: mysql+pymysql://root:root_ci_password@127.0.0.1:3306/nagriksetu_swd
        run: |
          python -c "
          import os
          from sqlalchemy import create_engine, inspect
          url = os.environ['DATABASE_URL']
          engine = create_engine(url)
          inspector = inspect(engine)
          tables = inspector.get_table_names()
          print(f'Successfully connected to MySQL 8.0! Verified {len(tables)} tables: {tables}')
          assert len(tables) >= 19, f'Expected 19 tables in nagriksetu_swd, found {len(tables)}'
          "

  docker-compose-check:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Docker Compose Config
        run: docker compose config
