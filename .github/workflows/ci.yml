name: NagrikSetu SWD CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript & Build Check
        working-directory: frontend
        run: npm run build

  backend-checks:
    name: Backend Syntax, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx flake8

      - name: Python Syntax & Lint Check
        working-directory: backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Unit Tests (SQLite Fixtures)
        working-directory: backend
        env:
          ENV: testing
        run: |
          # Run unit tests that use SQLite fixtures and mock client
          pytest -v tests/test_swd_service.py tests/test_citizen_auth.py tests/test_new_features.py tests/test_profile_management.py tests/test_rbac_comprehensive.py tests/test_rbac_security.py tests/test_smart_finder.py

  mysql-schema-validation:
    name: Isolated MySQL 8.0 DDL & Integration Validation
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: nagriksetu_swd
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate and Apply DDL Schema Files
        run: |
          echo "Applying 01_create_database.sql..."
          mysql -h 127.0.0.1 -P 3306 -u root -proot_ci_password < database/01_create_database.sql

          echo "Applying swd_db_setup.sql (Schema DDL)..."
          mysql -h 127.0.0.1 -P 3306 -u root -proot_ci_password nagriksetu_swd < database/swd_db_setup.sql

          echo "Applying create_offices_table.sql..."
          mysql -h 127.0.0.1 -P 3306 -u root -proot_ci_password nagriksetu_swd < database/create_offices_table.sql

          echo "Applying seed_finder_rules.sql..."
          mysql -h 127.0.0.1 -P 3306 -u root -proot_ci_password nagriksetu_swd < database/seed_finder_rules.sql

      - name: Setup Python for MySQL Integration Check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pymysql cryptography

      - name: Verify SQLAlchemy Dialect & Table Reflection against Isolated MySQL
        env:
          DATABASE_URL: mysql+pymysql://root:root_ci_password@127.0.0.1:3306/nagriksetu_swd
        run: |
          python -c "
          import os
          from sqlalchemy import create_engine, inspect
          url = os.environ['DATABASE_URL']
          engine = create_engine(url)
          inspector = inspect(engine)
          tables = inspector.get_table_names()
          print(f'Successfully connected to MySQL 8.0! Verified {len(tables)} tables: {tables}')
          assert len(tables) >= 10, f'Expected at least 10 tables in nagriksetu_swd, found {len(tables)}'
          "

  docker-compose-check:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config
